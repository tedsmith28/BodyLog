<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BodyLog | Food Log</title>

    <link rel="stylesheet" href="CSS/styles.css">
    <script src="JS/logs.js" defer></script>
</head>
<body data-log="foods">
    <header>
        <h1>BodyLog</h1>
        <nav>
            <a href="index.html">Dashboard</a>
            <a href="foodlog.html" class="active">Food Log</a>
            <a href="weightlog.html">Weight Log</a>
            <a href="exerciselog.html">Exercise Log</a>
        </nav>
    </header>
    <main>
        <h2>Food Log</h2>
        <p>Log your food intake for the selected date.</p>

        <form id="logForm" class="log-form">
            <label for="entryDate">Select a Date:</label>
            <input type="date" id="entryDate" required>

            <label for="entryDescription">Description of Food:</label>
            <input type="text" id="entryDescription" required>

            <label for="entryValue">Calories Consumed:</label>
            <input type="number" id="entryValue" min="1" step="1" required>

            <div class="form-buttons">
                <button type="submit" id="saveButton">Save Entry</button>
                <button type="button" id="cancelButton" hidden>
                    Cancel Edit
                </button>
            </div>
        </form>

        <p id="message" role="status"></p>

        <h3>Food History</h3>
        <label for="filterDate">Filter by Date:</label>
        <div class="history-filter">
            <input type="date" id="filterDate">
            <button type="button" id="showAllButton">Show All</button>
        </div>

        <p id= "historySummary"></p>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th scope="col">Date</th>
                        <th scope="col">Food Description</th>
                        <th scope="col">Calories</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
